name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Engine host tests, format and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        # Pinned: formatting and diagnostics differ between LLVM releases.
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          pip install clang-format==23.1.1 clang-tidy==22.1.8
      - name: Format check
        run: |
          find engine/src engine/include engine/tests engine/tools \( -name '*.cpp' -o -name '*.h' \) -not -path '*/data/*' \
            | xargs clang-format --dry-run --Werror
      - name: Configure
        run: cmake -S engine -B build/host -G Ninja -DAV_BUILD_TESTS=ON -DAV_BUILD_TOOLS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build/host
      - name: Unit tests
        run: ctest --test-dir build/host --output-on-failure
      - name: clang-tidy
        # Only the translation units of the host build (the Android-only files need the NDK headers).
        run: |
          python3 -c "import json;print('\n'.join(e['file'] for e in json.load(open('build/host/compile_commands.json')) if '/engine/src/' in e['file'] or '/engine/tests/' in e['file'] or '/engine/tools/' in e['file']))" \
            | xargs -P 4 -n 1 clang-tidy -p build/host --quiet 2>&1 | tee tidy.log
          ! grep -E 'warning:|error:' tidy.log

  android:
    name: Android build, JVM tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: SDK components
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0"
      - name: Build, unit tests, lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
          retention-days: 7
